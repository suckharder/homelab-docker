services:

############################
# PORTAINER
############################

  portainer:
    image: portainer/portainer-ce:lts
    container_name: portainer-ce
    # Not publishing -> internal netwotrk
    #   ports:
    #     - 8000:8000
    #     - 9443:9443
    networks:
      - internal_network
    volumes:
        - portainer_data:/data
        - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

############################

volumes:
  portainer_data:

networks:
  # Existing internal network
  internal_network:
    external: true