pageInfo:
  title: My Server
  description: Monitoring
  navLinks:
    - title: Dashy Docs
      path: https://dashy.to/docs
      target: newtab
appConfig:
  theme: thebe
  layout: auto
  iconSize: medium
  startingView: default
  defaultOpeningMethod: newtab
  statusCheck: false
  statusCheckInterval: 0
  faviconApi: allesedv
  routingMode: history
  enableMultiTasking: false
  widgetsAlwaysUseProxy: false
  webSearch:
    disableWebSearch: false
    searchEngine: duckduckgo
    openingMethod: newtab
    searchBangs: {}
  enableFontAwesome: true
  enableMaterialDesignIcons: false
  hideComponents:
    hideHeading: true
    hideNav: true
    hideSearch: true
    hideSettings: true
    hideFooter: true
  auth:
    enableGuestAccess: false
    users: []
    enableOidc: false
    oidc: {}
    enableHeaderAuth: false
    headerAuth:
      userHeader: REMOTE_USER
      proxyWhitelist: []
    enableKeycloak: false
  showSplashScreen: false
  preventWriteToDisk: false
  preventLocalSave: false
  disableConfiguration: false
  disableConfigurationForNonAdmin: false
  allowConfigEdit: true
  enableServiceWorker: false
  disableContextMenu: false
  disableUpdateChecks: false
  disableSmartSort: false
  enableErrorReporting: false
sections:
  - widgets:
      - type: gl-current-cpu
        options:
          hostname: https://glances-api1.example.com/
          apiVersion: 3
        id: 0_1175_glcurrentcpu
    name: CPU %
    icon: fas fa-tachometer-alt
    displayData:
      sortBy: default
      rows: 1
      cols: 1
      collapsed: false
      hideForGuests: false
    items: []
  - widgets:
      - type: gl-cpu-history
        options:
          hostname: https://glances-api1.example.com/
          apiVersion: 3
        id: 0_1892_glcpuhistory
    name: CPU History
    icon: fas fa-tachometer-alt
    displayData:
      sortBy: default
      rows: 1
      cols: 2
      collapsed: false
      hideForGuests: false
    items: []
  - widgets:
      - type: gl-mem-speedometer
        options:
          hostname: https://glances-api2.example.com/
          apiVersion: 3
        id: 0_1002_glmemspeedometer
    name: RAM %
    displayData:
      sortBy: default
      rows: 1
      cols: 1
      collapsed: false
      hideForGuests: false
    items: []
    icon: fas fa-memory
  - widgets:
      - type: gl-disk-space
        options:
          hostname: https://glances-api2.example.com/
          apiVersion: 3
        id: 0_1503_gldiskspace
    name: Storage %
    displayData:
      sortBy: default
      rows: 1
      cols: 1
      collapsed: false
      hideForGuests: false
    items: []
    icon: fas fa-hdd