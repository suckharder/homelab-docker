services:

############################
# NGINX PM
############################

  nginx-proxy-manager:
    container_name: nginx-proxy-manager
    image: 'jc21/nginx-proxy-manager:latest'
    restart: unless-stopped
    networks:
      - npm
      - internal_network
    ports:
      - 80:80   # Public HTTP Port
      - 443:443 # Public HTTPS Port
      - 127.0.0.1:81:81   # Admin Web Port, localhost only
      # Any stream host (L4 proxy) ports go here
      # - 6661:6661
      # - 6661:6661/udp
    environment:
      TZ: "Europe/Bratislava"
    volumes:
      - ./npm_data:/data
      - ./npm_letsencrypt:/etc/letsencrypt

############################
# AUTHENTIK DB
############################

  auth-postgresql:
    image: docker.io/library/postgres:16-alpine
    container_name: authentik-postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    volumes:
      - auth-database:/var/lib/postgresql/data
    networks:
      - internal_network
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}

############################
# AUTHENTIK SERVER
############################

  server:
    # Check Authentik Docs for recommended pinned version
    image: ghcr.io/goauthentik/server:2025.12.1
    container_name: authentik-server
    restart: unless-stopped
    command: server
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_POSTGRESQL__HOST: auth-postgresql
      AUTHENTIK_POSTGRESQL__USER: ${POSTGRES_USER}
      AUTHENTIK_POSTGRESQL__NAME: ${POSTGRES_DB}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${POSTGRES_PASSWORD}
      AUTHENTIK_ERROR_REPORTING__ENABLED: false
    volumes:
      - ./authentik-data:/data
      - ./authentik-custom-templates:/templates
      - ./authentik-media:/media
    networks:
      npm:
      internal_network:
    # Leave ports unpublished, access through the reverse proxy. Use the commented-out ports for reference. Use 9000 for outpost.
    ### ports:
    #   - "9000:9000"
    #   - "9443:9443"
    depends_on:
      auth-postgresql:
        condition: service_healthy

############################
# AUTHENTIK WORKER
############################

  worker:
    # USE THE SAME IMAGE AS THE SERVER!!!
    image: ghcr.io/goauthentik/server:2025.12.1
    container_name: authentik-worker
    restart: unless-stopped
    command: worker
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_POSTGRESQL__HOST: auth-postgresql
      AUTHENTIK_POSTGRESQL__USER: ${POSTGRES_USER}
      AUTHENTIK_POSTGRESQL__NAME: ${POSTGRES_DB}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${POSTGRES_PASSWORD}
      AUTHENTIK_ERROR_REPORTING__ENABLED: false
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./authentik-data:/data
      - ./authentik-certs:/certs
      - ./authentik-custom-templates:/templates
    networks:
      internal_network:
    depends_on:
      auth-postgresql:
        condition: service_healthy

############################

volumes:
  # authentik postgresql
  auth-database:
    driver: local

networks:
  npm:
    driver: bridge
  # Internal network - for proxied services
  internal_network:
    name: internal_network
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/16